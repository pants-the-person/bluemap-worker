        <title>BlueMap 98 — mc.pants.place</title>
        <script>
          (() => {
            const makeMemStorage = () => {
              const map = new Map();
              return {
                get length() { return map.size; },
                key(i) { return Array.from(map.keys())[i] ?? null; },
                getItem(k) { return map.has(String(k)) ? map.get(String(k)) : null; },
                setItem(k, v) { map.set(String(k), String(v)); },
                removeItem(k) { map.delete(String(k)); },
                clear() { map.clear(); },
              };
            };
            for (const name of ["localStorage", "sessionStorage"]) {
              try {
                const s = window[name];
                const k = "__pp98_probe__";
                s.setItem(k, "1");
                s.getItem(k);
                s.removeItem(k);
              } catch {
                try {
                  Object.defineProperty(window, name, {
                    configurable: true,
                    enumerable: true,
                    value: makeMemStorage(),
                  });
                } catch {}
              }
            }
            try {
              const origReplace = history.replaceState.bind(history);
              history.replaceState = (...args) => {
                try { return origReplace(...args); } catch {}
              };
            } catch {}

            const manifests = new Map();
            const manifestPromises = new Map();
            window.__pp98Manifest = {
              load(root, force = false) {
                if (!force && manifests.has(root)) return Promise.resolve(manifests.get(root));
                if (!force && manifestPromises.has(root)) return manifestPromises.get(root);
                const opts = force ? { cache: "reload" } : undefined;
                const p = fetch(`${root}/manifest.json`, opts)
                  .then((r) => (r.ok ? r.json() : { tiles: {}, items: {} }))
                  .then((data) => {
                    const m = { tiles: data?.tiles || {}, items: data?.items || {} };
                    manifests.set(root, m);
                    return m;
                  })
                  .catch(() => {
                    const empty = { tiles: {}, items: {} };
                    manifests.set(root, empty);
                    return empty;
                  })
                  .finally(() => manifestPromises.delete(root));
                manifestPromises.set(root, p);
                return p;
              },
              reload(root) {
                manifests.delete(root);
                manifestPromises.delete(root);
                return this.load(root, true);
              },
              tileUrl(root, lod, x, z, baseUrl) {
                const ver = manifests.get(root)?.tiles?.[`${lod}:${x}:${z}`];
                return ver ? `${baseUrl}?v=${ver}` : baseUrl;
              },
              itemUrl(root, key, baseUrl) {
                const ver = manifests.get(root)?.items?.[key];
                return ver ? `${baseUrl}?v=${ver}` : baseUrl;
              },
            };

            // Lightweight progress tracker for the 13.7 MB textures.json download
            // Drives the Win98 segmented progress bar on first load without delaying fetch.
            (() => {
              const origFetch = window.fetch.bind(window);
              window.__pp98LoadingProgress = { pct: 12, text: "Loading world metadata..." };
              const notify = (pct, text) => {
                window.__pp98LoadingProgress = { pct, text };
                const fill = document.getElementById("pp98-load-fill");
                const label = document.getElementById("pp98-load-status");
                const pctEl = document.getElementById("pp98-load-pct");
                if (fill) fill.style.width = `${Math.min(100, Math.max(4, pct))}%`;
                if (label && text) label.textContent = text;
                if (pctEl) pctEl.textContent = `${Math.round(pct)}%`;
              };
              window.__pp98SetLoadProgress = notify;
              window.fetch = async (input, init) => {
                const url = typeof input === "string" ? input : input?.url || "";
                const res = await origFetch(input, init);
                if (!url.includes("textures.json") || !res.ok || !res.body) return res;
                const total = Number(res.headers.get("content-length") || 0);
                notify(20, "Downloading modpack texture atlas...");
                let loaded = 0;
                const reader = res.body.getReader();
                const stream = new ReadableStream({
                  async pull(controller) {
                    const { done, value } = await reader.read();
                    if (done) {
                      notify(92, "Building 3D terrain & shaders...");
                      controller.close();
                      return;
                    }
                    loaded += value.byteLength;
                    if (total > 0) {
                      const pct = 20 + Math.min(70, (loaded / total) * 70);
                      const mb = (loaded / 1048576).toFixed(1);
                      const totMb = (total / 1048576).toFixed(1);
                      notify(pct, `Downloading textures.json (${mb} / ${totMb} MB)...`);
                    } else {
                      const mb = (loaded / 1048576).toFixed(1);
                      notify(Math.min(88, 25 + loaded / 262144), `Downloading textures.json (${mb} MB)...`);
                    }
                    controller.enqueue(value);
                  },
                  cancel(reason) {
                    return reader.cancel(reason);
                  },
                });
                return new Response(stream, {
                  status: res.status,
                  statusText: res.statusText,
                  headers: res.headers,
                });
              };
              setTimeout(() => {
                if (document.getElementById("bm-app-err")) {
                  document.getElementById("pp98-loading")?.classList.add("hidden");
                }
              }, 4000);
            })();

            const p = new URLSearchParams(location.search);
            const embed = p.get("embed") === "1" || p.get("embed") === "true" ||
              (p.get("embed") !== "0" && p.get("embed") !== "false" && (() => { try { return self !== top; } catch { return true; } })());
            if (embed) document.documentElement.classList.add("pp98-embed");
            try {
              const s = p.get("scheme") || localStorage.getItem("pp98-bluemap:scheme");
              if (s) document.documentElement.setAttribute("data-scheme", s);
              const c = p.get("crt") ?? localStorage.getItem("pp98-bluemap:crt");
              if (c === "false" || c === "0") document.documentElement.setAttribute("data-crt", "false");
              else document.documentElement.setAttribute("data-crt", "true");
            } catch {}
          })();
        </script>
