        <title>BlueMap 98 — mc.pants.place</title>
        <script>
          (() => {
            const makeMemStorage = () => {
              const map = new Map();
              return {
                get length() { return map.size; },
                key(i) { return Array.from(map.keys())[i] ?? null; },
                getItem(k) { return map.has(String(k)) ? map.get(String(k)) : null; },
                setItem(k, v) { map.set(String(k), String(v)); },
                removeItem(k) { map.delete(String(k)); },
                clear() { map.clear(); },
              };
            };
            for (const name of ["localStorage", "sessionStorage"]) {
              try {
                const s = window[name];
                const k = "__pp98_probe__";
                s.setItem(k, "1");
                s.getItem(k);
                s.removeItem(k);
              } catch {
                try {
                  Object.defineProperty(window, name, {
                    configurable: true,
                    enumerable: true,
                    value: makeMemStorage(),
                  });
                } catch {}
              }
            }
            try {
              const origReplace = history.replaceState.bind(history);
              history.replaceState = (...args) => {
                try { return origReplace(...args); } catch {}
              };
            } catch {}

            const manifests = new Map();
            const manifestPromises = new Map();
            const regionCache = new Map(); // cacheKey -> Map("x:z" -> { comp, bytes })
            const regionInflight = new Map();
            const MAX_MEM_REGIONS = 48;

            const parseRegionPack = (buf) => {
              const out = new Map();
              if (!buf || buf.byteLength < 8) return out;
              const u8 = new Uint8Array(buf);
              const view = new DataView(buf);
              if (u8[0] !== 0x42 || u8[1] !== 0x4d || u8[2] !== 0x39 || u8[3] !== 0x38) return out;
              const count = view.getUint16(6, true);
              let off = 8;
              for (let i = 0; i < count && off + 16 <= buf.byteLength; i++) {
                const x = view.getInt32(off, true);
                const z = view.getInt32(off + 4, true);
                const comp = u8[off + 8];
                const len = view.getUint32(off + 12, true);
                off += 16;
                if (off + len > buf.byteLength) break;
                out.set(`${x}:${z}`, { comp, bytes: u8.subarray(off, off + len) });
                off += len;
              }
              return out;
            };

            const decompressEntry = async (entry) => {
              if (!entry) return null;
              if (entry.comp === 1 && typeof DecompressionStream !== "undefined") {
                const stream = new Blob([entry.bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
                return await new Response(stream).arrayBuffer();
              }
              if (entry.comp === 2 && typeof DecompressionStream !== "undefined") {
                const stream = new Blob([entry.bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
                return await new Response(stream).arrayBuffer();
              }
              return entry.bytes.slice().buffer;
            };

            window.__pp98Manifest = {
              load(root, force = false) {
                if (!force && manifests.has(root)) return Promise.resolve(manifests.get(root));
                if (!force && manifestPromises.has(root)) return manifestPromises.get(root);
                const opts = force ? { cache: "reload" } : undefined;
                const p = fetch(`${root}/manifest.json`, opts)
                  .then((r) => (r.ok ? r.json() : { regionSize: 8, regions: null, items: {} }))
                  .then((data) => {
                    const m = {
                      regionSize: Number(data?.regionSize) || 8,
                      regions: data?.regions && typeof data.regions === "object" ? data.regions : null,
                      items: data?.items || {},
                    };
                    manifests.set(root, m);
                    return m;
                  })
                  .catch(() => {
                    const empty = { regionSize: 8, regions: null, items: {} };
                    manifests.set(root, empty);
                    return empty;
                  })
                  .finally(() => manifestPromises.delete(root));
                manifestPromises.set(root, p);
                return p;
              },
              reload(root) {
                manifests.delete(root);
                manifestPromises.delete(root);
                // Evict cached region entries whose version may have changed on reload
                for (const k of Array.from(regionCache.keys())) {
                  if (k.startsWith(root + "|")) regionCache.delete(k);
                }
                return this.load(root, true);
              },
              get(root) {
                return manifests.get(root) || null;
              },
              itemUrl(root, key, baseUrl) {
                const ver = manifests.get(root)?.items?.[key];
                return ver ? `${baseUrl}?v=${ver}` : baseUrl;
              },
            };

            window.__pp98Regions = {
              async getTileEntry(root, lod, x, z) {
                const m = manifests.get(root) || (await window.__pp98Manifest.load(root));
                const rSize = m.regionSize || 8;
                const rx = Math.floor(x / rSize);
                const rz = Math.floor(z / rSize);
                const rKey = `${lod}:${rx}:${rz}`;

                // Instant client-side skip for non-existent/empty 8x8 regions (0 HTTP requests!)
                if (m.regions !== null && !Object.prototype.hasOwnProperty.call(m.regions, rKey)) {
                  return null;
                }

                const ver = m.regions ? m.regions[rKey] : 0;
                const cacheKey = `${root}|${rKey}|${ver || 0}`;

                if (regionCache.has(cacheKey)) {
                  const pack = regionCache.get(cacheKey);
                  // Touch LRU order
                  regionCache.delete(cacheKey);
                  regionCache.set(cacheKey, pack);
                  return pack.get(`${x}:${z}`) || null;
                }

                let promise = regionInflight.get(cacheKey);
                if (!promise) {
                  const url = ver
                    ? `${root}/region/${lod}/${rx}/${rz}.pack?v=${ver}`
                    : `${root}/region/${lod}/${rx}/${rz}.pack`;
                  promise = fetch(url)
                    .then((r) => (r.ok ? r.arrayBuffer() : null))
                    .then((buf) => {
                      const pack = parseRegionPack(buf);
                      regionCache.set(cacheKey, pack);
                      while (regionCache.size > MAX_MEM_REGIONS) {
                        const oldest = regionCache.keys().next().value;
                        regionCache.delete(oldest);
                      }
                      return pack;
                    })
                    .catch(() => new Map())
                    .finally(() => regionInflight.delete(cacheKey));
                  regionInflight.set(cacheKey, promise);
                }

                const pack = await promise;
                return pack.get(`${x}:${z}`) || null;
              },
              async loadHiresTile(root, x, z) {
                const entry = await this.getTileEntry(root, 0, x, z);
                if (!entry) return null;
                return await decompressEntry(entry);
              },
              async loadLowresBlobUrl(root, lod, x, z) {
                const entry = await this.getTileEntry(root, lod, x, z);
                if (!entry) return null;
                const buf = entry.comp === 0 ? entry.bytes : await decompressEntry(entry);
                return URL.createObjectURL(new Blob([buf], { type: "image/png" }));
              },
            };

            // Lightweight progress tracker for the 13.7 MB textures.json download
            // Drives the Win98 segmented progress bar on first load without delaying fetch.
            (() => {
              const origFetch = window.fetch.bind(window);
              window.__pp98LoadingProgress = { pct: 12, text: "Loading world metadata..." };
              const notify = (pct, text) => {
                window.__pp98LoadingProgress = { pct, text };
                const fill = document.getElementById("pp98-load-fill");
                const label = document.getElementById("pp98-load-status");
                const pctEl = document.getElementById("pp98-load-pct");
                if (fill) fill.style.width = `${Math.min(100, Math.max(4, pct))}%`;
                if (label && text) label.textContent = text;
                if (pctEl) pctEl.textContent = `${Math.round(pct)}%`;
              };
              window.__pp98SetLoadProgress = notify;
              window.fetch = async (input, init) => {
                const url = typeof input === "string" ? input : input?.url || "";
                const res = await origFetch(input, init);
                if (!url.includes("textures.json") || !res.ok || !res.body) return res;
                const total = Number(res.headers.get("content-length") || 0);
                notify(20, "Downloading modpack texture atlas...");
                let loaded = 0;
                const reader = res.body.getReader();
                const stream = new ReadableStream({
                  async pull(controller) {
                    const { done, value } = await reader.read();
                    if (done) {
                      notify(92, "Building 3D terrain & shaders...");
                      controller.close();
                      return;
                    }
                    loaded += value.byteLength;
                    if (total > 0) {
                      const pct = 20 + Math.min(70, (loaded / total) * 70);
                      const mb = (loaded / 1048576).toFixed(1);
                      const totMb = (total / 1048576).toFixed(1);
                      notify(pct, `Downloading textures.json (${mb} / ${totMb} MB)...`);
                    } else {
                      const mb = (loaded / 1048576).toFixed(1);
                      notify(Math.min(88, 25 + loaded / 262144), `Downloading textures.json (${mb} MB)...`);
                    }
                    controller.enqueue(value);
                  },
                  cancel(reason) {
                    return reader.cancel(reason);
                  },
                });
                return new Response(stream, {
                  status: res.status,
                  statusText: res.statusText,
                  headers: res.headers,
                });
              };
              setTimeout(() => {
                if (document.getElementById("bm-app-err")) {
                  document.getElementById("pp98-loading")?.classList.add("hidden");
                }
              }, 4000);
            })();

            const p = new URLSearchParams(location.search);
            const embed = p.get("embed") === "1" || p.get("embed") === "true" ||
              (p.get("embed") !== "0" && p.get("embed") !== "false" && (() => { try { return self !== top; } catch { return true; } })());
            if (embed) document.documentElement.classList.add("pp98-embed");
            try {
              const s = p.get("scheme") || localStorage.getItem("pp98-bluemap:scheme");
              if (s) document.documentElement.setAttribute("data-scheme", s);
              const c = p.get("crt") ?? localStorage.getItem("pp98-bluemap:crt");
              if (c === "false" || c === "0") document.documentElement.setAttribute("data-crt", "false");
              else document.documentElement.setAttribute("data-crt", "true");
            } catch {}
          })();
        </script>
